# Build on every PR/push to `main`; on pushes to `main`, deploy `dist` to the `gh-pages` branch.
# In the repo: Settings → Pages → Build and deployment → Source: **Deploy from a branch** → Branch **gh-pages** / folder **/ (root)**.
# Demo mode is enabled in CI so the published site works without a backend.

name: Deploy GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Vite base path for GitHub Pages
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VITE_DEMO_MODE: "true"
        run: npm run build

      - name: SPA fallback (client-side routes on refresh)
        run: cp dist/index.html dist/404.html

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
